<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Dominic Bor, Data and ML Systems Engineer">
<title>Dominic Bor · Data &amp; ML Systems Engineer</title>
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="rgba(13,17,23,0.05)"/></pattern>
  <radialGradient id="glow" cx="18%" cy="0%" r="70%"><stop offset="0" stop-color="rgba(8,122,102,0.10)"/><stop offset="1" stop-color="rgba(8,122,102,0.10)" stop-opacity="0"/></radialGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#087a66" stop-opacity=".25"/><stop offset="1" stop-color="#087a66" stop-opacity="0"/></linearGradient>
  <clipPath id="card"><rect x="760" y="56" width="380" height="228" rx="14"/></clipPath>
</defs>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  .role { opacity: 0; animation: role 12s infinite; }
  @keyframes role { 0% { opacity: 0; transform: translateY(8px); } 3%, 22% { opacity: 1; transform: none; } 25%, 100% { opacity: 0; transform: translateY(-8px); } }
  .caret { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .line { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 3.2s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .pulse { animation: pulse 2s ease-out infinite; transform-origin: 1105px 82px; }
  @keyframes pulse { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(2.2); } }
  .in { opacity: 0; animation: in .8s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .role, .line, .pulse, .in, .caret { animation: none; opacity: 1; stroke-dashoffset: 0; } .role ~ .role { opacity: 0; } }
</style>
<rect width="1200" height="340" rx="18" fill="#ffffff"/>
<rect width="1200" height="340" rx="18" fill="url(#grid)"/>
<rect width="1200" height="340" rx="18" fill="url(#glow)"/>
<rect x=".5" y=".5" width="1199" height="339" rx="18" fill="none" stroke="#d0d7de"/>

<g class="in">
  <rect x="72" y="58" width="326" height="30" rx="15" fill="#f4f6f8" stroke="#d0d7de"/>
  <circle cx="92" cy="73" r="4.5" fill="#0ca30c"/>
  <text x="106" y="78" class="sans" font-size="13" fill="#3a4250">Open to remote work · New York (ET)</text>
</g>
<text x="70" y="150" class="sans in" style="animation-delay:.1s" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#0d1117">Dominic Bor</text>
<text x="72" y="182" class="mono in" style="animation-delay:.2s" font-size="16" fill="#59636e">Data &amp; ML Systems Engineer</text>
<text x="72" y="214" class="sans role" font-size="26" font-weight="600" fill="#087a66" style="animation-delay:0s">real-time payment layers</text><text x="72" y="214" class="sans role" font-size="26" font-weight="600" fill="#087a66" style="animation-delay:3s">event streaming pipelines</text><text x="72" y="214" class="sans role" font-size="26" font-weight="600" fill="#087a66" style="animation-delay:6s">production ML systems</text><text x="72" y="214" class="sans role" font-size="26" font-weight="600" fill="#087a66" style="animation-delay:9s">LLM &amp; agentic workflows</text>
<text x="72" y="250" class="sans in" style="animation-delay:.3s" font-size="20" fill="#3a4250">that stay fast, reliable, and cheap to run.</text>
<text x="72" y="296" class="mono in" style="animation-delay:.4s" font-size="13" fill="#59636e">fintech · gaming · healthcare   |   kdbor.engineer</text>

<g class="in" style="animation-delay:.25s">
  <rect x="760" y="56" width="380" height="228" rx="14" fill="#f4f6f8" stroke="#d0d7de"/>
  <g clip-path="url(#card)">
