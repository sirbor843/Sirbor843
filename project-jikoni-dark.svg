<svg xmlns="http://www.w3.org/2000/svg" width="480" height="150" viewBox="0 0 480 150" role="img" aria-label="Jikoni: A simple ios restaurant app for booking appointments and showcasing menu and recipes">
<title>Jikoni: A simple ios restaurant app for booking appointments and showcasing menu and recipes</title>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .rise { opacity: 0; animation: rise .6s cubic-bezier(.22,1,.36,1) forwards; }
  .fade { opacity: 0; animation: fade .5s ease forwards; }
  @media (prefers-reduced-motion: reduce) { .rise, .fade { animation: none; opacity: 1; } }
</style>
<rect x="0.5" y="0.5" width="479" height="149" rx="14" fill="#11141a" stroke="#262b35"/>
  <g class="rise">
    <text x="24" y="44" class="mono" font-size="16" font-weight="700" fill="#34d3b4">Jikoni</text>
    <text x="456" y="44" text-anchor="end" class="sans" font-size="16" fill="#8b93a1">↗</text>
    <text x="24" y="78" class="sans" font-size="13.5" fill="#b3bac5">An iOS restaurant app for booking appointments and</text><text x="24" y="98" class="sans" font-size="13.5" fill="#b3bac5">showcasing menus and recipes.</text>
    <circle cx="29" cy="122" r="5" fill="#F05138"/><text x="40" y="126" class="sans" font-size="12" fill="#8b93a1">Swift</text><text x="456" y="126" text-anchor="end" class="mono" font-size="11" fill="#8b93a1">updated 1mo ago</text>
  </g>
</svg>