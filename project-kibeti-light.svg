<svg xmlns="http://www.w3.org/2000/svg" width="480" height="150" viewBox="0 0 480 150" role="img" aria-label="Kibeti: An ios app which is a clone of MPESA APP">
<title>Kibeti: An ios app which is a clone of MPESA APP</title>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .rise { opacity: 0; animation: rise .6s cubic-bezier(.22,1,.36,1) forwards; }
  .fade { opacity: 0; animation: fade .5s ease forwards; }
  @media (prefers-reduced-motion: reduce) { .rise, .fade { animation: none; opacity: 1; } }
</style>
<rect x="0.5" y="0.5" width="479" height="149" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <g class="rise">
    <text x="24" y="44" class="mono" font-size="16" font-weight="700" fill="#087a66">Kibeti</text>
    <text x="456" y="44" text-anchor="end" class="sans" font-size="16" fill="#59636e">↗</text>
    <text x="24" y="78" class="sans" font-size="13.5" fill="#3a4250">An iOS take on the M-Pesa mobile-money app, built in</text><text x="24" y="98" class="sans" font-size="13.5" fill="#3a4250">Swift.</text>
    <circle cx="29" cy="122" r="5" fill="#F05138"/><text x="40" y="126" class="sans" font-size="12" fill="#59636e">Swift</text><text x="456" y="126" text-anchor="end" class="mono" font-size="11" fill="#59636e">updated 6mo ago</text>
  </g>
</svg>