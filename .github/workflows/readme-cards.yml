# Regenerates the profile README's SVG cards from live GitHub data and
# publishes them to the `output` branch, so `main` gets no bot commits.
name: Profile README cards

on:
  schedule:
    - cron: '17 3 * * *' # daily, 06:17 Nairobi
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/readme/**'
      - '.github/workflows/readme-cards.yml'

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Render stats, languages, activity, build log and project cards
        run: node scripts/readme/generate.mjs --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#087a66&color_dots=#ebedf0,#b3e4d9,#6cc7b2,#2a9d85,#087a66
            dist/snake-dark.svg?palette=github-dark&color_snake=#34d3b4&color_dots=#1a1f27,#0f4f43,#188c76,#26b39a,#34d3b4

      - name: Publish to the output branch
        run: |
          cd dist
          # this branch is images only: keep Vercel from deploying it
          echo '{ "git": { "deploymentEnabled": false } }' > vercel.json
          git init -q -b output
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update profile README cards"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
